name: archlens-diff
# A: ArchLens semantic model diff, stable-layout images, rule R1, and the archlens/model-diff check.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # push images to the poc-artifacts branch
  pull-requests: write   # comment
  checks: write          # archlens/model-diff check run
  statuses: write        # fallback

concurrency:
  group: poc-artifacts
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ARTIFACTS_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check out base revision next to head
        run: git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Graphviz and the tool
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
          dot -V
          cd tools/archlens && pnpm install --frozen-lockfile
      - name: Run unit tests
        run: cd tools/archlens && pnpm test
      - name: Export base and head workspaces (Structurizr via Docker)
        run: |
          tools/export.sh "$RUNNER_TEMP/base/model" "$RUNNER_TEMP/export/base" json
          tools/export.sh model "$RUNNER_TEMP/export/head" json
      - name: ArchLens diff (twice, to prove determinism)
        id: diff
        run: |
          RAW="https://raw.githubusercontent.com/$REPO/poc-artifacts/archlens/pr-$PR/$HEAD_SHA"
          cd tools/archlens
          run() { node src/cli.ts diff --base "$RUNNER_TEMP/export/base/workspace.json" --head "$RUNNER_TEMP/export/head/workspace.json" \
                    --compose ../../deploy/docker-compose.yml --out "$1" --image-base-url "$RAW" --base-label "base ${BASE_SHA:0:7}" --head-label "head ${HEAD_SHA:0:7}"; }
          set +e
          run "$RUNNER_TEMP/out"; echo "code=$?" >> "$GITHUB_OUTPUT"
          run "$RUNNER_TEMP/out2" > /dev/null
          set -e
          A=$(cd "$RUNNER_TEMP/out/images" && sha256sum *.svg | sha256sum | cut -c1-16)
          B=$(cd "$RUNNER_TEMP/out2/images" && sha256sum *.svg | sha256sum | cut -c1-16)
          echo "image set hash run 1: $A / run 2: $B"
          if [ "$A" != "$B" ]; then echo "NOT deterministic" >&2; exit 1; fi
          echo "Determinism: ran twice on the same inputs, SVG set hash \`$A\` both times (Graphviz $(dot -V 2>&1 | grep -o 'version [0-9.]*'))." > "$RUNNER_TEMP/out/determinism.txt"
      - name: Publish images to poc-artifacts
        run: tools/publish-artifacts.sh "$RUNNER_TEMP/out/images" "archlens/pr-$PR/$HEAD_SHA" "ArchLens images for $HEAD_SHA"
      - name: Post comment and set archlens/model-diff
        run: |
          cd tools/archlens
          node src/cli.ts post --repo "$REPO" --pr "$PR" --sha "$HEAD_SHA" --out "$RUNNER_TEMP/out" --details-url "$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
      - name: Keep outputs as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: archlens-out
          path: ${{ runner.temp }}/out
